    <circle cx="34" cy="34" r="8" fill="none" stroke="#34d399" stroke-width="3"/><path d="m40 40 7 7" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Recherche</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Sources &amp; preuves</text>
  </g>
  <g transform="translate(724 330)">
    <rect width="160" height="134" rx="18" fill="#201d16" stroke="#fbbf24" stroke-opacity=".65"/>
    <rect x="18" y="18" width="38" height="38" rx="11" fill="#fbbf24" fill-opacity=".13"/>
    <path d="m28 43 7-15 5 10 8-6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Stratégie</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Angle éditorial</text>
  </g>
  <g transform="translate(938 330)">
    <rect width="160" height="134" rx="18" fill="#211a1f" stroke="#fb7185" stroke-opacity=".65"/>
    <rect x="18" y="18" width="38" height="38" rx="11" fill="#fb7185" fill-opacity=".13"/>
    <path d="M28 29h18v16H28zM32 25h18v16" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Studio contenu</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Blog, image, social</text>
  </g>
  <g transform="translate(1152 330)">
    <rect width="160" height="134" rx="18" fill="#171d29" stroke="#60a5fa" stroke-opacity=".65"/>
    <rect x="18" y="18" width="38" height="38" rx="11" fill="#60a5fa" fill-opacity=".13"/>
    <path d="m28 37 6 6 13-15" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Qualité</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Contrôle &amp; pack</text>
  </g>
  <g transform="translate(1366 330)">
    <rect width="160" height="134" rx="18" fill="#17221d" stroke="#34d399" stroke-opacity=".65"/>
    <rect x="18" y="18" width="38" height="38" rx="11" fill="#34d399" fill-opacity=".13"/>
    <path d="M28 31h9l4 5h8v12H28z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Google Drive</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Livraison finale</text>
  </g>

  <g transform="translate(82 528)">
    <rect width="1444" height="108" rx="18" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="26" y="37" fill="#8290a3" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SORTIES</text>
    <g transform="translate(26 54)" font-family="Arial, sans-serif" font-size="14" font-weight="700">
      <rect width="180" height="34" rx="10" fill="#5eb8ff" fill-opacity=".1"/><text x="18" y="22" fill="#8ed0ff">Articles de blog</text>
      <rect x="194" width="166" height="34" rx="10" fill="#a78bfa" fill-opacity=".1"/><text x="212" y="22" fill="#c4b5fd">Visuels générés</text>
      <rect x="374" width="177" height="34" rx="10" fill="#60a5fa" fill-opacity=".1"/><text x="392" y="22" fill="#93c5fd">Posts LinkedIn</text>
      <rect x="565" width="185" height="34" rx="10" fill="#fb7185" fill-opacity=".1"/><text x="583" y="22" fill="#fda4af">Posts Instagram</text>
      <rect x="764" width="209" height="34" rx="10" fill="#34d399" fill-opacity=".1"/><text x="782" y="22" fill="#6ee7b7">Pack final dans Drive</text>
    </g>
