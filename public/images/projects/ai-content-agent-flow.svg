    <text x="28" y="45" fill="#a78bfa" font-family="monospace" font-size="22" font-weight="700">{ }</text>
    <text x="18" y="81" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Normaliser</text>
    <text x="18" y="106" fill="#8290a3" font-family="Arial, sans-serif" font-size="13">Contexte &amp; format</text>
  </g>
  <g transform="translate(510 330)">
    <rect width="160" height="134" rx="18" fill="#151f25" stroke="#34d399" stroke-opacity=".65"/>
